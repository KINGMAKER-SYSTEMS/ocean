# Courier manifest — the routing contract for this courier.
# The hub router (../hub/router.py) reads every courier.toml to build the
# slash-command → courier table.

name = "tt-uploader"
description = "Read-first ops window into the TikTok auto-uploader engine (Playwright stealth + FastAPI backend; Google Drive intake → TikTok Studio for RT's owned pages)."

# deterministic = the router runs the harness directly (no LLM spawn).
mode = "deterministic"

# Entry point the router invokes, relative to this manifest's directory.
entry = "bin/courier"

# One slash, many verbs: no `subcommand` here, so the router passes the
# operator's args verbatim to bin/courier, which dispatches to verified
# read-only surfaces — backend GET routes (/health, /api/system/proxy/status,
# /api/accounts, /api/uploads) and the orchestrator's live status files under
# the engine's logs/. v1 deliberately declares NO upload-trigger command:
# uploads stay entirely behind the engine's own self-healing orchestrator.
[[commands]]
slash = "/ttup"
summary = "Inspect the TikTok auto-uploader: backend health, supervisor status, heartbeat vs daily target, queue manifests, post ledger, source readiness, proxy status"
usage = "/ttup <health|status|heartbeat|escalations|queue|posts|source|dry-run|proxy|accounts|uploads> [args]"
