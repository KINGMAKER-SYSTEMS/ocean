# voice-intake — assistant manifest (mirrors the courier.toml pattern).
#
# Where a courier.toml declares a deterministic/agentic courier + its slash
# commands, an assistant manifest declares a brain-in-the-loop specialist: its
# identity entry, its surfaces, and how a turn is scoped to it. voice-intake is
# the port of RT's "Voice Memos → Autonomous Pipeline" intake loop: Eric drops
# voice memos; the assistant transcribes, deciphers, and mints ANCHORED tickets
# into the right pipeline's backing store.

name = "voice-intake"
class = "assistant"            # vs. "courier" — brain-in-the-loop, not outbound-only
description = "Voice-memo intake specialist: transcribe (mlx-whisper GPU harness), decipher, and mint anchored, deduped tickets into Linear (SALE/OUT/CAMP/CONT/OCEAN) or GitHub Issues — idempotent via SHA ledger."

# agentic = every turn is reasoned by the Ocean daemon (POST /v1/prompt) scoped to
# this dir; the daemon auto-loads CLAUDE.md/AGENTS.md via load_project_prompt.
mode = "agentic"

# Entry identity files the daemon ancestor-walk picks up when cwd is this dir.
entry = "CLAUDE.md"

# Surfaces this assistant is authored for. CLI = the terminal / Claude-Code-style
# surface (v1) — intake runs are shell-native: whisper harness, gh, Linear API.
surfaces = ["CLI"]

# --- CLI surface binding (terminal / Claude Code) --------------------------
[surface.CLI]
# Ocean OS client_type → surface map: cli → [CLI] (ocean-os surface_dir).
client_type = "cli"
cwd = "assistants/voice-intake"
tools = "CLI/tools.toml"
profile = "CLI/system.md"
session_key = "cli:voice-intake:{cwd}"

# --- Engine (the production intake loop, stays in place) --------------------
# This package is identity + protocol only. The engine — GOAL-PROMPT.md (the
# canonical behavior spec), the .processed-memos.json SHA ledger, transcripts,
# and intake reports — lives in its own working dir and is NOT vendored here.
# Resolve it via env, defaulting to the production location.
[engine]
dir_env = "OCEAN_VOICE_INTAKE_ENGINE_DIR"
dir_default = "/Users/ericcromartie/Documents/Development/Voice Memos To Do"
goal_prompt = "GOAL-PROMPT.md"           # relative to engine dir — canonical source of truth
ledger = ".processed-memos.json"         # relative to engine dir — idempotency ledger (sacred)

# --- Destinations (backing stores tickets are minted into) ------------------
[destinations]
# Linear GraphQL (teams SALE / OUT / CAMP / CONT / OCEAN).
linear_api_url = "https://api.linear.app/graphql"
linear_api_key_env = "LINEAR_API_KEY"
# GitHub Issues pipelines (via `gh`; auth = gh's own login, no key here).
github_repos = ["ecfromthedc/rt-yt-substrate"]
