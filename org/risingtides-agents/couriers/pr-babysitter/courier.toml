# Courier manifest — the routing contract for this courier.
# The hub router (../hub/router.py) reads every courier.toml to build the
# slash-command → courier table.
#
# This courier is a *package* over a standalone engine that already runs in
# production on cron (pr-babysitter-agent). The engine and its cron stay
# untouched; this manifest adds identity + an on-demand path into it.

name = "pr-babysitter"
description = "Unattended PR maintenance — triage Eric's open GitHub PRs, fix CI/conflicts/review comments, merge safe PRs, report."

# agentic = the router POSTs a scoped prompt to the Ocean daemon with
# cwd = this dir; the daemon agent loads CLAUDE.md here and drives bin/courier.
mode = "agentic"

# Harness the agent drives (agentic couriers don't get exec'd by the router,
# but the entry is still the canonical way in).
entry = "bin/courier"

[[commands]]
slash = "/babysit"
summary = "Run one PR-babysitting pass over Eric's open GitHub PRs"
usage = "/babysit"
prompt = """
You are the pr-babysitter courier. Before acting, load the operating protocol
in this directory's CLAUDE.md and follow it exactly. Run ONE babysitting pass
over Eric's open GitHub PRs by driving the harness — do not hand-roll gh or
codex calls:

1. Run `bin/courier run`. The engine owns the whole pass (PR listing, Codex
   triage and fixes, waiting on checks, safe merges, logging). If it prints
   "already running", a pass is already in flight behind its lock dir: do NOT
   retry, do NOT remove the lock — report that a pass is in flight and stop.
2. When the run returns, run `bin/courier status` and read the agent report
   and the tail of the latest log.
3. Reply with a short status: what changed, what merged, what still needs a
   human, or the exact blocker.

Hard rules (absolute): never force-push, never close PRs, never delete
branches, never rotate secrets.
"""

[[commands]]
slash = "/babysit-status"
summary = "Report the latest babysitting run (read-only — starts nothing)"
usage = "/babysit-status"
prompt = """
You are the pr-babysitter courier in read-only mode. Load this directory's
CLAUDE.md for context, then run `bin/courier status` ONLY — never
`bin/courier run`, no writes, no gh mutations, and never touch the lock dir.
Summarize for the operator: whether a pass is currently in flight (lock held),
when the last run happened, what it changed and merged, and what still needs a
human. If there are no logs yet, say so plainly.
"""
