name: Release
on:
  workflow_dispatch:
    inputs:
      windows_native_probe:
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: desktop-manifest-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  manifest:
    name: Diagnose Windows Tauri manifest rewrite
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Inspect pinned CLI before native compilation
        shell: python
        run: |
          import difflib, hashlib, json, os, pathlib, subprocess, sys, tomllib
          sys.dont_write_bytecode = True
          sys.path.insert(0, str(pathlib.Path('apps/ocean-surface/packaging').resolve()))
          import build_desktop as desktop
          target = 'x86_64-pc-windows-msvc'
          manifest = desktop.NATIVE / 'Cargo.toml'
          before = manifest.read_bytes()
          subprocess.run(['git', 'status', '--porcelain'], check=True)
          subprocess.run(['git', 'config', '--show-origin', '--get-regexp', r'core\.(autocrlf|eol|filemode)'], check=False)
          binary = desktop.download_tool(
              f'https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v{desktop.TAURI_VERSION}/cargo-tauri-{target}.zip',
              desktop.TAURI_HASHES[target], desktop.SURFACE / 'target/manifest-probe', 'cargo-tauri.exe', True)
          assert not (desktop.SURFACE / 'dist').exists()
          # The missing frontend deliberately stops the CLI before compilation.
          # RustInterface's manifest rewrite runs earlier and remains observable.
          result = subprocess.run([str(binary), 'build', '--ci', '--no-bundle'], cwd=desktop.NATIVE,
                                  env=desktop.build_env(), timeout=300)
          after = manifest.read_bytes()
          print(json.dumps({'cli_exit': result.returncode, 'bytes_equal': before == after,
                            'toml_equal': tomllib.loads(before.decode()) == tomllib.loads(after.decode()),
                            'before_sha': hashlib.sha256(before).hexdigest(), 'after_sha': hashlib.sha256(after).hexdigest(),
                            'before_crlf': before.count(bytes([13,10])), 'after_crlf': after.count(bytes([13,10]))}))
          print(''.join(difflib.unified_diff(before.decode().splitlines(True), after.decode().splitlines(True))))
          subprocess.run(['git', 'status', '--porcelain'], check=True)
          subprocess.run(['git', 'diff', '--no-ext-diff', '--', 'apps/ocean-surface/crates/ocean-tauri/Cargo.toml'], check=True)
          assert before == after, 'Tauri changed the LF-pinned manifest'
          assert not subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip(), 'Probe changed source'
