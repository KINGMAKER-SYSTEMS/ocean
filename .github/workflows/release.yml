name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mac-native-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Diagnose unchanged Mac native tests
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/ocean-surface
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Confirm application source matches Accounts candidate
        shell: python
        working-directory: .
        run: |
          import subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only', '8d39b059d99be4b08572c2a88ab94501d9297380', 'HEAD'], text=True).splitlines()
          assert set(changed) <= {'.github/workflows/release.yml', '.github/AGENTS.md'}, changed
      - name: Install repository toolchain
        run: |
          toolchain="$(awk -F '"' '/^channel = / { print $2; exit }' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --target wasm32-unknown-unknown
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: |
            apps/ocean-surface -> target
            apps/ocean-surface/crates/ocean-tauri -> target
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: trunk@0.21.14
      - name: Build actual web bundle
        run: env -u NO_COLOR trunk build --locked
      - name: Run unchanged native suite
        working-directory: apps/ocean-surface/crates/ocean-tauri
        run: cargo test --locked --lib
      - name: Repeat unchanged watcher acceptance
        working-directory: apps/ocean-surface/crates/ocean-tauri
        run: |
          for attempt in 1 2 3; do
            echo "Watcher repetition $attempt"
            cargo test --locked --lib scoped_native_watch_release -- --nocapture
          done
